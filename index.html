<!DOCTYPE html>
<html lang="an">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Palabra Aragonesa del Día</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <h1>A Palabra Aragonesa d'o Día</h1>
    <div class="header-buttons">
      <button id="btn-stats" class="icon-btn" title="Estadísticas">📊</button>
    </div>
  </div>

  <div class="mode-selector">
    <button id="btn-daily" class="mode-btn active">Diario</button>
    <button id="btn-practice" class="mode-btn">Práctica</button>
  </div>

  <div id="word-counter" class="word-counter"></div>

  <div id="game-board" class="board"></div>

  <div id="keyboard" class="keyboard"></div>

  <!-- Modal Resultado -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modal-title"></h2>
      <p id="modal-word" class="modal-word-text"></p>
      <p id="modal-definition" class="modal-def-text"></p>

      <div class="modal-buttons">
        <button id="share-btn" class="btn">📋 Compartir resultado</button>
        <button id="next-word-btn" class="btn hidden">Siguiente palabra</button>
        <button id="close-modal" class="btn">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Modal Estadísticas -->
  <div id="stats-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Estadísticas</h2>
      <div class="stats-container">
        <div class="stat-box">
          <span id="stat-played" class="stat-num">0</span>
          <span class="stat-label">Jugadas</span>
        </div>
        <div class="stat-box">
          <span id="stat-winrate" class="stat-num">0%</span>
          <span class="stat-label">% Victorias</span>
        </div>
        <div class="stat-box">
          <span id="stat-streak" class="stat-num">0</span>
          <span class="stat-label">Racha actual</span>
        </div>
        <div class="stat-box">
          <span id="stat-max-streak" class="stat-num">0</span>
          <span class="stat-label">Racha máxima</span>
        </div>
      </div>
      <div class="modal-buttons">
        <button id="close-stats" class="btn">Cerrar</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
