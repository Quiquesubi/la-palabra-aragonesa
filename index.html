<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palabra Aragonesa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>PALABRA ARAGONESA</h1>
    <p class="hashtag">#lapalabraaragonesadeldía</p>
    <p id="word-counter" class="word-counter"></p>
    
    <div class="mode-container">
      <button id="btn-daily" class="btn-mode active">Palabra del Día</button>
      <button id="btn-practice" class="btn-mode">Modo Libre</button>
    </div>
  </header>

  <main>
    <div id="game-board"></div>
    <div id="keyboard"></div>
  </main>

  <div id="modal" class="hidden">
    <div class="modal-content">
      <h2 id="modal-title"></h2>
      <p id="modal-word" class="highlight-word"></p>
      <p id="modal-definition"></p>
      <button id="next-word-btn" class="hidden">Siguiente palabra</button>
      <button id="close-modal">Cerrar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
