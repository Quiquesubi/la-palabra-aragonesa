<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Palabra Aragonesa</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <h1>La palabra aragonesa</h1>
  </div>

  <div class="mode-selector">
    <button id="btn-daily" class="mode-btn active">Palabra del día</button>
    <button id="btn-practice" class="mode-btn">Modo libre</button>
    <button id="btn-stats" class="mode-btn icon-btn" title="Estadísticas">📊 Estadísticas</button>
  </div>

  <div id="word-counter" class="word-counter"></div>

  <div id="game-board" class="board"></div>

  <div id="keyboard" class="keyboard"></div>

  <!-- Modal Resultado -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modal-title"></h2>
      <p id="modal-word" class="modal-word-text"></p>
      <p id="modal-definition" class="modal-def-text"></p>

      <div class="modal-buttons">
        <button id="share-btn" class="btn">📲 Compartir resultado</button>
        <button id="next-word-btn" class="btn hidden">Siguiente palabra</button>
        <button id="close-modal" class="btn">Cerrar</button>
      </div>
    </div>
  </div>

  <!-- Modal Estadísticas -->
  <div id="stats-modal" class="modal hidden">
    <div class="modal-content">
      <h2>Estadísticas</h2>

      <!-- Pestañas de modo para estadísticas -->
      <div class="stats-tabs">
        <button id="tab-daily" class="stat-tab active">Palabra del día</button>
        <button id="tab-practice" class="stat-tab">Modo libre</button>
        <button id="tab-total" class="stat-tab">Total</button>
      </div>

      <div class="stats-summary">
        <div class="stat-box">
          <span id="stat-played" class="stat-num">0</span>
          <span class="stat-label">Jugadas</span>
        </div>
        <div class="stat-box">
          <span id="stat-winrate" class="stat-num">0%</span>
          <span class="stat-label">% Victorias</span>
        </div>
        <div class="stat-box">
          <span id="stat-streak" class="stat-num">0</span>
          <span class="stat-label">Racha actual</span>
        </div>
        <div class="stat-box">
          <span id="stat-max-streak" class="stat-num">0</span>
          <span class="stat-label">Racha máxima</span>
        </div>
      </div>

      <h3>Distribución de intentos</h3>
      <div class="guess-distribution">
        <div class="dist-row"><span>1º</span><div class="dist-bar"><span id="dist-1">0</span></div></div>
        <div class="dist-row"><span>2º</span><div class="dist-bar"><span id="dist-2">0</span></div></div>
        <div class="dist-row"><span>3º</span><div class="dist-bar"><span id="dist-3">0</span></div></div>
        <div class="dist-row"><span>4º</span><div class="dist-bar"><span id="dist-4">0</span></div></div>
        <div class="dist-row"><span>5º</span><div class="dist-bar"><span id="dist-5">0</span></div></div>
        <div class="dist-row"><span>6º</span><div class="dist-bar"><span id="dist-6">0</span></div></div>
      </div>

      <div class="modal-buttons">
        <button id="close-stats" class="btn">Cerrar</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
